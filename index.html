<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prison Bot Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 5rem 1rem;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .glass-btn {
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.1) 0%, rgba(14, 165, 233, 0.2) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:active { transform: scale(0.96); }

        .glass-btn-danger {
            background: linear-gradient(180deg, rgba(248, 113, 113, 0.1) 0%, rgba(220, 38, 38, 0.2) 100%);
            border: 1px solid rgba(248, 113, 113, 0.3);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
        }
        .glass-btn-danger:active { transform: scale(0.96); }

        .tab-btn {
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .boss-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }
        
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }

        .terminal-log {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .toggle-checkbox:checked { right: 0; border-color: #38bdf8; }
        .toggle-checkbox:checked + .toggle-label { background-color: #38bdf8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="glass-panel p-4 mb-5 flex justify-between items-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 via-blue-500 to-sky-400 opacity-50"></div>
        <div>
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-300">PRISON BOT</h1>
            <div class="flex items-center text-xs mt-1 text-gray-400">
                <span id="server-dot" class="status-dot status-offline mr-2"></span>
                <span id="server-status">Ожидание связи...</span>
            </div>
        </div>
        <div class="text-right">
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Баланс сигарет</div>
            <div class="font-bold text-xl text-white flex items-center justify-end gap-1">
                <span id="cigs-balance" class="text-shadow-sm">0</span> <span>🚬</span>
            </div>
            <button onclick="sendCommand('collect_cigs')" class="text-[10px] text-sky-400 uppercase tracking-wider mt-1 hover:text-sky-300 transition">Собрать налог</button>
        </div>
    </header>

    <div id="fix-connection-btn" class="hidden mb-5">
        <button onclick="fixConnection()" class="w-full bg-red-500/20 border border-red-500/50 text-red-300 p-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(239,68,68,0.2)] animate-pulse">
            <span class="text-lg">⚠️</span> 
            <span>Связь заблокирована. Нажмите, чтобы починить!</span>
        </button>
    </div>

    <div class="flex justify-around mb-6 border-b border-white/10 pb-2">
        <button onclick="switchTab('arena')" id="tab-arena" class="tab-btn active pb-2 px-4">АРЕНА</button>
        <button onclick="switchTab('bosses')" id="tab-bosses" class="tab-btn pb-2 px-4">БОССЫ</button>
        <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn pb-2 px-4">ЛОГИ</button>
    </div>

    <div id="content-arena" class="flex-1 flex flex-col gap-4 animate-fade-in">
        <div class="glass-panel p-5">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Настройки Арены</h2>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] text-sky-400 uppercase tracking-wider font-bold">Бесконечно</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="infinity-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                        <label for="infinity-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-600 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>
            </div>
            
            <div id="cycles-container" class="grid grid-cols-2 gap-4 mb-4 transition-all duration-300">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-gray-500 mb-1">Кол-во циклов</label>
                    <input type="number" id="input-cycles" value="1" class="glass-input w-full p-2 text-center text-lg font-bold">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-gray-500 mb-1">До раунда</label>
                    <input type="number" id="input-rounds" value="5" class="glass-input w-full p-2 text-center text-lg font-bold">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-wider text-gray-500 mb-1">Действие на лимите</label>
                <select id="input-action" class="glass-input w-full p-2 text-sm appearance-none font-semibold">
                    <option value="surrender">Забрать награду (Побег)</option>
                    <option value="stop">Остановить скрипт в бою</option>
                </select>
            </div>
            
            <div>
                <label class="block text-[10px] uppercase tracking-wider text-gray-500 mb-1">Порог еды (Шоколад)</label>
                <div class="flex items-center gap-2">
                    <span class="text-xl">⚡</span>
                    <input type="number" id="input-energy" value="200" class="glass-input w-full p-2 font-bold text-center">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-2">
            <button onclick="startArena()" class="glass-btn text-white font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-2">
                <span class="text-3xl drop-shadow-[0_0_8px_rgba(56,189,248,0.8)]">▶️</span>
                <span class="text-[10px] uppercase tracking-widest">Старт Арены</span>
            </button>
            <button onclick="sendCommand('stop')" class="glass-btn-danger text-white font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-2">
                <span class="text-3xl drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]">🛑</span>
                <span class="text-[10px] uppercase tracking-widest">Остановить</span>
            </button>
        </div>
    </div>

    <!-- TAB 2: БОССЫ (ДИНАМИЧЕСКИЕ ИЗ ИГРЫ) -->
    <div id="content-bosses" class="hidden flex-1 flex flex-col">
        <button onclick="startBosses()" class="glass-btn w-full text-white font-bold py-4 rounded-xl mb-4 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(56,189,248,0.2)]">
            <span class="text-2xl drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]">👹</span>
            <span class="tracking-widest uppercase text-sm">Убить выбранных</span>
        </button>
        <div class="overflow-y-auto pr-2 pb-10 space-y-2 flex-1" id="boss-list">
            <div class="text-center text-gray-500 text-xs py-4">Синхронизация с сервером игры...</div>
        </div>
    </div>

    <!-- TAB 3: ЛОГИ -->
    <div id="content-logs" class="hidden flex-1 flex flex-col h-full">
        <div class="flex justify-between items-end mb-2 px-1">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Терминал</h2>
            <button onclick="document.getElementById('log-container').innerHTML=''" class="text-[10px] text-gray-600 hover:text-sky-400 transition">Очистить</button>
        </div>
        <div id="log-container" class="terminal-log flex-1 p-3 overflow-y-auto flex flex-col gap-1 shadow-inner h-[55vh]">
            <div class="text-sky-400 font-bold mb-2">PrisonBot Panel v6.0 Ready.</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.platform !== 'tdesktop' && tg.platform !== 'macos') tg.expand();
        tg.ready();
        if (tg.setHeaderColor) { tg.setHeaderColor('#0f172a'); tg.setBackgroundColor('#000000'); }

        const SERVER_URL = 'https://382ad95679aa580d-94-73-249-143.serveousercontent.com'; 
        
        const logsContainer = document.getElementById('log-container');
        window.lastKnownStatus = '';
        window.realBosses = null;
        let renderedBossesStr = '';

        function appendLog(msg, type = 'info') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
            
            let colorClass = 'text-gray-300';
            if (msg.includes('ОШИБКА') || type === 'error') colorClass = 'text-red-400';
            if (msg.includes('Сбор завершен') || msg.includes('Арена завершена') || msg.includes('УБИТ') || type === 'success') colorClass = 'text-emerald-400';
            if (msg.includes('⚡') || msg.includes('Арена:') || msg.includes('Бьем босса')) colorClass = 'text-sky-300';

            div.className = `${colorClass} py-0.5 border-b border-white/5 last:border-0 leading-tight`;
            div.innerHTML = `<span class="text-gray-600 text-[10px] mr-2">[${time}]</span> ${msg}`;
            logsContainer.appendChild(div);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // --- ДИНАМИЧЕСКАЯ ОТРИСОВКА БОССОВ ---
        function renderBosses(bosses) {
            const bossListEl = document.getElementById('boss-list');
            if (!bosses || bosses.length === 0) {
                bossListEl.innerHTML = '<div class="text-center text-red-400 text-xs py-4">Не удалось найти боссов. Возможно, ошибка API или нет доступных рейдов.</div>';
                return;
            }
            bossListEl.innerHTML = '';
            bosses.forEach(b => {
                const el = document.createElement('div');
                el.className = 'boss-card p-3 flex items-center justify-between w-full';
                el.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <input type="checkbox" class="boss-checkbox w-5 h-5 accent-sky-500 rounded cursor-pointer shrink-0" value="${b.uuid}" checked>
                        <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center text-xl border border-white/5 shadow-inner shrink-0">👹</div>
                        <div class="flex flex-col w-full">
                            <div class="font-bold text-sm text-gray-200">${b.name}</div>
                            <div id="cd-${b.uuid}" class="text-[10px] font-mono text-gray-500 bg-black/30 rounded px-1.5 py-0.5 mt-0.5 w-fit">Загрузка КД...</div>
                        </div>
                    </div>
                `;
                bossListEl.appendChild(el);
            });
        }

        // --- УМНЫЙ ОПРОС СЕРВЕРА ---
        let fetchTimeout;
        let failCount = 0;

        async function fetchState() {
            try {
                const res = await fetch(SERVER_URL + '/api/state', { headers: { 'Bypass-Tunnel-Reminder': 'true' }});
                if (!res.ok) throw new Error('Status Error');
                const state = await res.json();
                
                failCount = 0; 
                document.getElementById('server-dot').className = 'status-dot status-online mr-2';
                document.getElementById('server-status').textContent = 'Связь установлена';
                document.getElementById('server-status').className = 'text-emerald-400 font-bold';
                document.getElementById('fix-connection-btn').classList.add('hidden');
                
                if (state.balance !== undefined) document.getElementById('cigs-balance').textContent = Number(state.balance).toLocaleString('ru-RU');
                
                // Рендерим боссов, если список изменился
                if (state.realBosses && JSON.stringify(state.realBosses) !== renderedBossesStr) {
                    renderedBossesStr = JSON.stringify(state.realBosses);
                    renderBosses(state.realBosses);
                }
                if (state.realBosses) window.realBosses = state.realBosses;

                if (state.status && state.status !== window.lastKnownStatus) {
                    appendLog(state.status);
                    window.lastKnownStatus = state.status;
                }
            } catch (err) {
                failCount++;
                if (failCount >= 3) {
                    document.getElementById('server-dot').className = 'status-dot status-offline mr-2';
                    document.getElementById('server-status').textContent = 'Потеряно соединение';
                    document.getElementById('server-status').className = 'text-red-400';
                    document.getElementById('fix-connection-btn').classList.remove('hidden');
                }
            }
            fetchTimeout = setTimeout(fetchState, 1500);
        }
        fetchState();

        // --- ТАЙМЕРЫ БОССОВ ---
        setInterval(() => {
            if (!window.realBosses) return;
            const now = Date.now();

            window.realBosses.forEach(b => {
                const el = document.getElementById(`cd-${b.uuid}`);
                if (!el) return;

                if (b.nextTime > now) {
                    const diff = b.nextTime - now;
                    let h = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
                    let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    let s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

                    el.innerHTML = `⏳ КД: <span class="text-amber-400">${h}:${m}:${s}</span>`;
                    el.className = "text-[10px] font-mono text-gray-400 bg-black/40 rounded px-1.5 py-0.5 mt-0.5 w-fit border border-amber-500/20";
                } else {
                    el.innerHTML = "✅ ДОСТУПЕН";
                    el.className = "text-[10px] font-bold text-emerald-400 bg-emerald-500/10 rounded px-1.5 py-0.5 mt-0.5 w-fit border border-emerald-500/30 shadow-[0_0_10px_rgba(16,185,129,0.2)]";
                }
            });
        }, 1000);

        function fixConnection() {
            tg.openLink(SERVER_URL);
            tg.showAlert("В открывшемся окне нажмите синюю кнопку 'Click to Continue', затем закройте его и связь появится!");
            failCount = 0; 
        }

        async function sendCommand(cmd, payload = {}) {
            tg.HapticFeedback.impactOccurred('light');
            fetch(SERVER_URL + '/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                body: JSON.stringify({ cmd, ...payload })
            }).catch(() => { appendLog('Ошибка отправки: ' + cmd, 'error'); });
            
            if(cmd !== 'start_bosses') appendLog('>> Отправлена команда: ' + cmd, 'info');
        }

        function startArena() {
            const isInfinity = document.getElementById('infinity-toggle').checked;
            const config = {
                mode: isInfinity ? 'infinity' : 'rounds',
                cycleCount: isInfinity ? 999999 : (parseInt(document.getElementById('input-cycles').value) || 1),
                targetRound: parseInt(document.getElementById('input-rounds').value) || 5,
                limitAction: document.getElementById('input-action').value,
                energyThreshold: parseInt(document.getElementById('input-energy').value) || 200
            };
            sendCommand('start_arena', { config });
            tg.HapticFeedback.impactOccurred('medium');
        }

        function startBosses() {
            const selectedBosses = Array.from(document.querySelectorAll('.boss-checkbox:checked')).map(cb => cb.value);
            if (selectedBosses.length === 0) return tg.showAlert("Выберите хотя бы одного босса!");
            appendLog(`>> Старт рейдов (Выбрано боссов: ${selectedBosses.length})`, 'info');
            sendCommand('start_bosses', { bosses: selectedBosses });
        }

        document.getElementById('infinity-toggle').addEventListener('change', function(e) {
            const cyclesContainer = document.getElementById('cycles-container');
            cyclesContainer.style.opacity = e.target.checked ? '0.3' : '1';
            cyclesContainer.style.pointerEvents = e.target.checked ? 'none' : 'auto';
            tg.HapticFeedback.selectionChanged();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('content-arena').classList.add('hidden');
            document.getElementById('content-bosses').classList.add('hidden');
            document.getElementById('content-logs').classList.add('hidden');
            document.getElementById('content-' + tabId).classList.remove('hidden');
            tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
