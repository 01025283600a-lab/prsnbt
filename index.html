<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prison Bot Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            /* Отступ для "чёлки" айфона (safe-area-inset-top) */
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            padding-left: 16px;
            padding-right: 16px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-btn {
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.1) 0%, rgba(14, 165, 233, 0.2) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
            transition: all 0.2s ease;
        }
        
        .glass-btn:active {
            transform: scale(0.96);
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.2) 0%, rgba(14, 165, 233, 0.3) 100%);
        }

        .glass-btn-danger {
            background: linear-gradient(180deg, rgba(248, 113, 113, 0.1) 0%, rgba(220, 38, 38, 0.2) 100%);
            border: 1px solid rgba(248, 113, 113, 0.3);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
        }
        
        .glass-btn-danger:active {
            transform: scale(0.96);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            transition: border-color 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .tab-btn {
            color: rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .boss-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }

        .terminal-log {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-track { background: transparent; }
        .terminal-log::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        
        .toggle-checkbox:checked { right: 0; border-color: #38bdf8; }
        .toggle-checkbox:checked + .toggle-label { background-color: #38bdf8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Status -->
    <header class="glass-panel p-4 mb-6 flex justify-between items-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 via-blue-500 to-sky-400 opacity-50"></div>
        <div>
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-300">PRISON BOT</h1>
            <div class="flex items-center text-xs mt-1 text-gray-400">
                <span id="server-dot" class="status-dot status-offline mr-2"></span>
                <span id="server-status">Ожидание связи...</span>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-400 mb-1">Баланс сигарет</div>
            <div class="font-bold text-lg text-white flex items-center justify-end gap-1">
                <span id="cigs-balance">0</span> <span class="text-xl">🚬</span>
            </div>
            <button onclick="sendCommand('collect_cigs')" class="text-[10px] text-sky-400 uppercase tracking-wider mt-1 hover:text-sky-300 transition">Собрать налог</button>
        </div>
    </header>

    <!-- Tabs Navigation -->
    <div class="flex justify-around mb-6 border-b border-white/10 pb-2">
        <button onclick="switchTab('arena')" id="tab-arena" class="tab-btn active pb-2 px-4 font-semibold tracking-wide">АРЕНА</button>
        <button onclick="switchTab('bosses')" id="tab-bosses" class="tab-btn pb-2 px-4 font-semibold tracking-wide">БОССЫ</button>
        <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn pb-2 px-4 font-semibold tracking-wide">ЛОГИ</button>
    </div>

    <!-- TAB 1: ARENA -->
    <div id="content-arena" class="flex-1">
        <div class="glass-panel p-5 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Настройка Арены</h2>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400">Бесконечно</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="infinity-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                        <label for="infinity-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-600 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>
            </div>
            
            <div id="cycles-container" class="grid grid-cols-2 gap-4 mb-4 transition-all duration-300">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Циклов</label>
                    <input type="number" id="input-cycles" value="1" class="glass-input w-full p-2 text-center font-bold">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">До раунда</label>
                    <input type="number" id="input-rounds" value="5" class="glass-input w-full p-2 text-center font-bold">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs text-gray-400 mb-1">На лимите (когда раунд достигнут)</label>
                <select id="input-action" class="glass-input w-full p-2 text-sm appearance-none">
                    <option value="surrender">Выйти и забрать награду</option>
                    <option value="stop">Остановиться в бою</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">Порог еды (Зажимать если ниже)</label>
                <div class="flex items-center gap-2">
                    <span class="text-xl">⚡</span>
                    <input type="number" id="input-energy" value="200" class="glass-input w-full p-2 font-bold">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="startArena()" class="glass-btn text-white font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-1">
                <span class="text-2xl">▶️</span>
                <span class="text-xs uppercase tracking-wider">Запуск Арены</span>
            </button>
            <button onclick="sendCommand('stop')" class="glass-btn-danger text-white font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-1">
                <span class="text-2xl">🛑</span>
                <span class="text-xs uppercase tracking-wider">Остановить</span>
            </button>
        </div>
    </div>

    <!-- TAB 2: BOSSES -->
    <div id="content-bosses" class="hidden flex-1 flex flex-col">
        <button onclick="startBosses()" class="glass-btn w-full text-white font-bold py-4 rounded-xl mb-6 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(56,189,248,0.3)]">
            <span class="text-2xl">👹</span>
            <span class="tracking-widest uppercase text-sm">Убить выбранных боссов</span>
        </button>

        <div class="flex justify-between items-center mb-3 pl-1">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Очередь Рейда</h2>
            <div class="flex gap-4">
                <button onclick="toggleAllBosses(true)" class="text-[10px] text-sky-400 hover:text-sky-300 uppercase tracking-wider font-bold">Выбрать всех</button>
                <button onclick="toggleAllBosses(false)" class="text-[10px] text-gray-500 hover:text-white uppercase tracking-wider font-bold">Сбросить</button>
            </div>
        </div>
        
        <div class="overflow-y-auto pr-2 pb-10 space-y-2 flex-1" id="boss-list">
            <!-- Bosses will be injected here via JS -->
        </div>
    </div>

    <!-- TAB 3: LOGS -->
    <div id="content-logs" class="hidden flex-1 flex flex-col h-full">
        <div class="flex justify-between items-end mb-2 px-1">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Терминал</h2>
            <button onclick="document.getElementById('log-container').innerHTML=''" class="text-[10px] text-gray-500 hover:text-white transition">Очистить</button>
        </div>
        <div id="log-container" class="terminal-log flex-1 p-3 overflow-y-auto flex flex-col gap-1 shadow-inner h-[60vh]">
            <div class="text-sky-400">PrisonBot Panel v2.1 initialized.</div>
            <div class="text-gray-400">Ожидание логов сервера...</div>
        </div>
    </div>

    <script>
        // Init Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем только на мобилках (iOS/Android), на ПК оставляем стандарным
        if (tg.platform === 'ios' || tg.platform === 'android') {
            tg.expand();
        }
        
        tg.ready();
        
        if (tg.setHeaderColor) {
            tg.setHeaderColor('#0f172a');
            tg.setBackgroundColor('#000000');
        }

        // ==========================================
        // БОССЫ (Точный список и ID из бэкенда!)
        // ==========================================
        const bosses = [
            { id: 'homa', name: 'Кучерявый', emoji: '🧑‍🦱' },
            { id: 'banker', name: 'Банкир', emoji: '💼' },
            { id: 'ashab', name: 'Ашаб', emoji: '🧔🏽‍♂️' },
            { id: 'oleg', name: 'Олег Дежавю', emoji: '🌀' },
            { id: 'makaron', name: 'Арсений Макарон', emoji: '🍝' },
            { id: 'mrbusiness', name: 'Бизнесмен', emoji: '📈' },
            { id: 'baretsky', name: 'Пиджак', emoji: '👔' },
            { id: 'zhan', name: 'Жан Четырехпалый', emoji: '🖐️' },
            { id: 'sergey', name: 'Сергей Пирамидович', emoji: '🔺' },
            { id: 'nurlyz', name: 'Нурлыз Суетанов', emoji: '🌪️' },
            { id: 'zahar', name: 'Захар', emoji: '🪓' },
            { id: 'dipipi', name: 'Ди Пипи', emoji: '🎧' },
            { id: 'foma', name: 'Фома', emoji: '💪' },
            { id: 'iceman', name: 'Шайба', emoji: '🏒' },
            { id: 'burnman', name: 'Паяльник', emoji: '🔥' },
            { id: 'slesar', name: 'Слесарь', emoji: '🔧' },
            { id: 'vito', name: 'Вито', emoji: '🤌' },
            { id: 'cook', name: 'Повар', emoji: '🔪' },
            { id: 'snakecharmer', name: 'Погремушка', emoji: '🪇' },
            { id: 'monk', name: 'Монах', emoji: '📿' },
            { id: 'waterman', name: 'Сантехник', emoji: '🪠' },
            { id: 'cheater', name: 'Шулер', emoji: '🃏' },
            { id: 'buryat', name: 'Бурят', emoji: '😑' },
            { id: 'mafioznik', name: 'Мафиозник', emoji: '🔫' },
            { id: 'karateist', name: 'Каратист', emoji: '🥋' }
        ];

        const bossListEl = document.getElementById('boss-list');
        bosses.forEach(b => {
            const el = document.createElement('label');
            el.className = 'boss-card p-3 flex items-center justify-between cursor-pointer block';
            el.innerHTML = `
                <div class="flex items-center gap-4">
                    <input type="checkbox" value="${b.id}" checked class="boss-checkbox w-5 h-5 rounded border-gray-600 bg-black/50 accent-sky-500">
                    <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center text-xl border border-white/5 shadow-inner">
                        ${b.emoji}
                    </div>
                    <div>
                        <div class="font-bold text-sm text-gray-200">${b.name}</div>
                        <div class="text-[10px] text-gray-500 tracking-wider" id="status-${b.id}">Ожидает рейда</div>
                    </div>
                </div>
                <div class="text-xs px-2 py-1 rounded bg-white/5 border border-white/10 text-gray-400">
                    ${b.id}
                </div>
            `;
            bossListEl.appendChild(el);
        });

        // Функция Выбрать всех / Сбросить
        function toggleAllBosses(state) {
            document.querySelectorAll('.boss-checkbox').forEach(cb => cb.checked = state);
            tg.HapticFeedback.selectionChanged();
        }

        // ==========================================
        // ВЗАИМОДЕЙСТВИЕ С СЕРВЕРОМ
        // ==========================================
        const SERVER_URL = 'https://corporate-gatherer-trade.ngrok-free.dev'; 
        
        const socket = io(SERVER_URL, {
            transports: ['websocket', 'polling']
        });

        const statusDot = document.getElementById('server-dot');
        const statusText = document.getElementById('server-status');
        const logsContainer = document.getElementById('log-container');

        function appendLog(msg, type = 'info') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
            
            let colorClass = 'text-gray-300';
            if (msg.includes('ОШИБКА') || msg.includes('❌') || type === 'error') colorClass = 'text-red-400';
            if (msg.includes('УСПЕШНО') || msg.includes('✅') || type === 'success') colorClass = 'text-emerald-400';
            if (msg.includes('Удар по') || msg.includes('💥')) colorClass = 'text-amber-300';
            if (msg.includes('Зажимаю') || msg.includes('Энергия') || msg.includes('⚡')) colorClass = 'text-sky-300';

            div.className = `${colorClass} py-0.5 border-b border-white/5 last:border-0`;
            div.innerHTML = `<span class="text-gray-600 text-[10px] mr-2">[${time}]</span> ${msg}`;
            
            logsContainer.appendChild(div);
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            if (currentTab !== 'logs') {
                const tab = document.getElementById('tab-logs');
                tab.classList.add('text-white');
                setTimeout(() => tab.classList.remove('text-white'), 300);
            }
        }

        socket.on('connect', () => {
            statusDot.className = 'status-dot status-online mr-2';
            statusText.textContent = 'Связь установлена';
            statusText.className = 'text-emerald-400';
            appendLog('Успешно подключено к серверу бота на ПК', 'success');
        });

        socket.on('disconnect', () => {
            statusDot.className = 'status-dot status-offline mr-2';
            statusText.textContent = 'Потеряно соединение';
            statusText.className = 'text-red-400';
            appendLog('Связь с сервером оборвана. Проверьте окно на ПК.', 'error');
        });

        socket.on('bot_log', (data) => {
            appendLog(data);
            
            if (data.includes('Бьем босса:')) {
                const parts = data.split(': ');
                if (parts.length > 1) {
                    const bid = parts[1].replace('...', '').trim();
                    const stEl = document.getElementById(`status-${bid}`);
                    if (stEl) {
                        stEl.textContent = '⚔️ В бою...';
                        stEl.className = 'text-[10px] text-amber-400 font-bold tracking-wider';
                    }
                }
            } else if (data.includes('повержен!')) {
                bosses.forEach(b => {
                    if (data.includes(b.id) || data.includes(b.name)) {
                        const stEl = document.getElementById(`status-${b.id}`);
                        if (stEl) {
                            stEl.textContent = '💀 Мертв (КД)';
                            stEl.className = 'text-[10px] text-red-400 tracking-wider';
                        }
                    }
                });
            }
        });

        socket.on('update_balance', (data) => {
            if (data && data.cigs) {
                document.getElementById('cigs-balance').textContent = Number(data.cigs).toLocaleString('ru-RU');
            }
        });

        function sendCommand(cmd, payload = {}) {
            if (!socket.connected) {
                tg.showAlert("Нет связи с ПК! Проверьте, запущен ли бот и ngrok.");
                return;
            }
            tg.HapticFeedback.impactOccurred('light');
            socket.emit('command', { cmd, ...payload });
        }

        function startArena() {
            const isInfinity = document.getElementById('infinity-toggle').checked;
            const payload = {
                energyThreshold: parseInt(document.getElementById('input-energy').value) || 200,
                limitAction: document.getElementById('input-action').value,
                mode: isInfinity ? 'infinity' : 'rounds',
                targetRound: isInfinity ? 999999 : (parseInt(document.getElementById('input-rounds').value) || 5),
                cycleCount: isInfinity ? 999999 : (parseInt(document.getElementById('input-cycles').value) || 1)
            };
            sendCommand('start_arena', payload);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function startBosses() {
            // Собираем всех выбранных боссов
            const checkboxes = document.querySelectorAll('.boss-checkbox:checked');
            const selectedBosses = Array.from(checkboxes).map(cb => cb.value);
            
            if (selectedBosses.length === 0) {
                tg.showAlert("Пожалуйста, выберите хотя бы одного босса!");
                return;
            }

            sendCommand('start_bosses', { bosses: selectedBosses });
            tg.HapticFeedback.impactOccurred('medium');
        }

        document.getElementById('infinity-toggle').addEventListener('change', function(e) {
            const cyclesContainer = document.getElementById('cycles-container');
            if (e.target.checked) {
                cyclesContainer.style.opacity = '0.3';
                cyclesContainer.style.pointerEvents = 'none';
            } else {
                cyclesContainer.style.opacity = '1';
                cyclesContainer.style.pointerEvents = 'auto';
            }
            tg.HapticFeedback.selectionChanged();
        });

        let currentTab = 'arena';
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            document.getElementById('content-arena').classList.add('hidden');
            document.getElementById('content-bosses').classList.add('hidden');
            document.getElementById('content-logs').classList.add('hidden');
            
            document.getElementById('content-' + tabId).classList.remove('hidden');
            currentTab = tabId;
            tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
